# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ── Build Performance ──
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true

# ── Compose Compiler ──
# Enable strong skipping for better Compose performance
kotlin.compose.strongSkipping=true

# ── R8 / APK size ──
# Full mode = aggressive optimization (giảm thêm ~10% size release)
android.enableR8.fullMode=true
# Bỏ resource cũ không tham chiếu khi merge (giúp shrinkResources hiệu quả hơn)
android.nonFinalResIds=true
