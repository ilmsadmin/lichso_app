services:
  # ============================================
  # NGINX - Reverse Proxy
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: zplus_lichso_nginx
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
    networks:
      - zplus_lichso_network
    restart: unless-stopped

  # ============================================
  # GO FIBER - Backend API
  # ============================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: zplus_lichso_api
    ports:
      - "${API_PORT:-8080}:8080"
    env_file:
      - ./backend/.env
    environment:
      - APP_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-zplus_db}
      - DB_USER=${POSTGRES_USER:-zplus_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-zplus_secret}
      - MONGODB_URI=mongodb://${MONGO_USER:-zplus_user}:${MONGO_PASSWORD:-zplus_secret}@mongodb:27017
      - MONGODB_DATABASE=${MONGO_DB:-zplus_logs}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      redis:
        condition: service_healthy
    networks:
      - zplus_lichso_network
    restart: unless-stopped

  # ============================================
  # NEXT.JS - Frontend
  # ============================================
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-development}
    container_name: zplus_lichso_web
    ports:
      - "${WEB_PORT:-3000}:3000"
    env_file:
      - ./frontend/.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8080/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    networks:
      - zplus_lichso_network
    restart: unless-stopped

  # ============================================
  # POSTGRESQL
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: zplus_lichso_postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zplus_db}
      POSTGRES_USER: ${POSTGRES_USER:-zplus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zplus_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zplus_user} -d ${POSTGRES_DB:-zplus_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zplus_lichso_network
    restart: unless-stopped

  # ============================================
  # MONGODB
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: zplus_lichso_mongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-zplus_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-zplus_secret}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-zplus_logs}
    volumes:
      - mongodb_data:/data/db
      - ./docker/mongodb/init.js:/docker-entrypoint-initdb.d/init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_USER:-zplus_user}", "-p", "${MONGO_PASSWORD:-zplus_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zplus_lichso_network
    restart: unless-stopped

  # ============================================
  # REDIS
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: zplus_lichso_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - zplus_lichso_network
    restart: unless-stopped

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  zplus_lichso_network:
    driver: bridge
