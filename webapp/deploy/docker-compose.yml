# ============================================
# Lịch Số - Production Docker Compose
# Server: 42.96.17.167 | Domain: lichso.vn
# ============================================

services:
  # ============================================
  # GO FIBER - Backend API
  # ============================================
  api:
    image: localhost:5000/lichso-backend:${IMAGE_TAG:-latest}
    container_name: lichso-backend
    ports:
      - "127.0.0.1:8092:8080"
    environment:
      # Application
      - APP_NAME=Lịch Số
      - APP_ENV=production
      - APP_PORT=8080
      - APP_DEBUG=false
      - APP_URL=https://lichso.vn
      - APP_SECRET=${APP_SECRET}
      # PostgreSQL
      - DB_HOST=lichso-postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-lichso_db}
      - DB_USER=${POSTGRES_USER:-lichso_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_SSL_MODE=disable
      - DB_MAX_CONNECTIONS=25
      - DB_MAX_IDLE_CONNECTIONS=5
      - DB_MAX_LIFETIME=300
      # MongoDB
      - MONGODB_URI=mongodb://${MONGO_USER:-lichso_user}:${MONGO_PASSWORD}@lichso-mongodb:27017
      - MONGODB_DATABASE=${MONGO_DB:-lichso_logs}
      - MONGODB_MAX_POOL_SIZE=50
      - MONGODB_MIN_POOL_SIZE=5
      # Redis
      - REDIS_HOST=lichso-redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_DB=0
      - REDIS_POOL_SIZE=10
      # JWT
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_EXPIRY=15m
      - JWT_REFRESH_TOKEN_EXPIRY=168h
      - JWT_ISSUER=lichso
      # CORS
      - CORS_ALLOWED_ORIGINS=https://lichso.vn,https://www.lichso.vn
      - CORS_ALLOWED_METHODS=GET,POST,PUT,PATCH,DELETE,OPTIONS
      - CORS_ALLOWED_HEADERS=Origin,Content-Type,Accept,Authorization
      - CORS_MAX_AGE=86400
      # Rate Limiting
      - RATE_LIMIT_MAX=100
      - RATE_LIMIT_WINDOW=60
      - RATE_LIMIT_LOGIN_MAX=5
      - RATE_LIMIT_LOGIN_WINDOW=60
      # Logging
      - LOG_LEVEL=info
      - LOG_FORMAT=json
      - LOG_OUTPUT=stdout
      # File Upload
      - UPLOAD_MAX_SIZE=10485760
      - UPLOAD_ALLOWED_TYPES=image/jpeg,image/png,image/gif,image/webp,application/pdf
      - UPLOAD_PATH=./uploads
      # Password Reset
      - PASSWORD_RESET_TOKEN_EXPIRY=3600
      - PASSWORD_RESET_URL=https://lichso.vn/reset-password
      # Google OAuth
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_ANDROID_CLIENT_ID=${GOOGLE_ANDROID_CLIENT_ID:-}
      # SMTP
      - SMTP_ENABLED=${SMTP_ENABLED:-false}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-noreply@lichso.vn}
      - SMTP_FROM_NAME=Lịch Số
      - SMTP_ENCRYPTION=tls
      # AI Integration (OpenRouter)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - AI_SITE_URL=https://lichso.vn
      - AI_SITE_NAME=LichSo.vn
      - AI_ARTICLE_MODEL=${AI_ARTICLE_MODEL:-deepseek/deepseek-chat}
      - AI_HOROSCOPE_MODEL=${AI_HOROSCOPE_MODEL:-anthropic/claude-sonnet-4}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-openai/gpt-4o-mini}
      - AI_MAX_TOKENS_ARTICLE=${AI_MAX_TOKENS_ARTICLE:-4096}
      - AI_MAX_TOKENS_HOROSCOPE=${AI_MAX_TOKENS_HOROSCOPE:-2048}
      - AI_MAX_TOKENS_CHAT=${AI_MAX_TOKENS_CHAT:-1024}
      - AI_RATE_HOROSCOPE_GUEST=${AI_RATE_HOROSCOPE_GUEST:-2}
      - AI_RATE_HOROSCOPE_FREE=${AI_RATE_HOROSCOPE_FREE:-5}
      - AI_RATE_HOROSCOPE_PREMIUM=${AI_RATE_HOROSCOPE_PREMIUM:-30}
      - AI_MONTHLY_BUDGET_CAP=${AI_MONTHLY_BUDGET_CAP:-50.0}
      # Pexels image search
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      lichso-postgres:
        condition: service_healthy
      lichso-mongodb:
        condition: service_started
      lichso-redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - lichso_network
    restart: always

  # ============================================
  # NEXT.JS - Frontend
  # ============================================
  web:
    image: localhost:5000/lichso-frontend:${IMAGE_TAG:-latest}
    container_name: lichso-frontend
    ports:
      - "127.0.0.1:3092:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_APP_NAME=Lịch Số
      - NEXT_PUBLIC_API_URL=https://lichso.vn/api
      - API_INTERNAL_URL=http://lichso-backend:8080/api
      - NEXT_PUBLIC_API_TIMEOUT=10000
      - NEXT_PUBLIC_ACCESS_TOKEN_KEY=lichso_access_token
      - NEXT_PUBLIC_REFRESH_TOKEN_KEY=lichso_refresh_token
      - NEXT_PUBLIC_ENABLE_SOCIAL_LOGIN=true
      - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - NEXT_PUBLIC_FACEBOOK_APP_ID=${FACEBOOK_APP_ID:-}
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 128M
          cpus: "0.25"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://0.0.0.0:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - lichso_network
    restart: always

  # ============================================
  # POSTGRESQL
  # ============================================
  lichso-postgres:
    image: postgres:16-alpine
    container_name: lichso-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lichso_db}
      POSTGRES_USER: ${POSTGRES_USER:-lichso_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lichso_user} -d ${POSTGRES_DB:-lichso_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lichso_network
    restart: always

  # ============================================
  # MONGODB
  # ============================================
  lichso-mongodb:
    image: mongo:7.0
    container_name: lichso-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-lichso_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-lichso_logs}
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "-u", "${MONGO_USER:-lichso_user}", "-p", "${MONGO_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - lichso_network
    restart: always

  # ============================================
  # REDIS
  # ============================================
  lichso-redis:
    image: redis:7-alpine
    container_name: lichso-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"
    networks:
      - lichso_network
    restart: always

# ============================================
# VOLUMES
# ============================================
volumes:
  postgres_data:
    driver: local
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  uploads_data:
    driver: local

# ============================================
# NETWORKS
# ============================================
networks:
  lichso_network:
    driver: bridge
